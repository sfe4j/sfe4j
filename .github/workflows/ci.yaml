name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: cr.amoylabs.com
  IMAGE_NAME: sfe4j/sfe4j-demo
  JAVA_VERSION: '25'

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Prepare + Unit Test + Integration Test
  # ──────────────────────────────────────────────
  test:
    name: Unit Test & Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify environment
        run: |
          pwd
          ls -al
          mvn -version

      - name: Clean
        run: |
          rm -rf ./target
          mvn clean

      - name: Run tests
        run: mvn test

  # ──────────────────────────────────────────────
  # Stage 2: Package
  # ──────────────────────────────────────────────
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Package (skip tests)
        run: mvn package -Dmaven.test.skip=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: sfe4j-spring-boot-sample/target/sfe4j-spring-boot-sample.jar
          retention-days: 1

  # ──────────────────────────────────────────────
  # Stage 3: Build & Push Docker Image
  # ──────────────────────────────────────────────
  build-and-push-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: sfe4j-spring-boot-sample/target/

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.run_number }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .cicd/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
