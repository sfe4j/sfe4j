name: CI/CD Pipeline
run-name: "${{ github.event_name == 'workflow_dispatch' && format('CI/CD Pipeline (Docker: {0})', inputs.build_image == true && 'yes' || 'no') || github.event.pull_request.title || github.event.head_commit.message || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      build_image:
        description: 'Build and push Docker image'
        required: true
        type: boolean
        default: false
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  IMAGE_NAME: sfe4j/sfe4j
  JAVA_VERSION: '25'

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Prepare + Unit Test + Integration Test
  # ──────────────────────────────────────────────
  test:
    name: Unit Test & Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify environment
        run: |
          pwd
          ls -al
          mvn -version

      - name: Clean
        run: |
          rm -rf ./target
          mvn clean

      - name: Run tests
        run: mvn test

  # ──────────────────────────────────────────────
  # Stage 2: Package
  # ──────────────────────────────────────────────
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Package (skip tests)
        run: mvn package -Dmaven.test.skip=true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-jar
          path: sfe4j-spring-boot-sample/target/sfe4j-spring-boot-sample.jar
          retention-days: 1

  # ──────────────────────────────────────────────
  # Stage 3: Build & Push Docker Image
  # ──────────────────────────────────────────────
  build-and-push-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: package
    if: inputs.build_image == true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: sfe4j-spring-boot-sample/target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=1.0.${{ github.run_number }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .cicd/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
