server:
  port: 8080

# Logging
logging:
  file:
    name: /data/logs/app.log

# SFE4J configuration
# Every value can be overridden by an environment variable. The defaults keep the historical
# behaviour: the whole file system stays reachable. See config/application-prod.yaml for the
# recommended production setup.
sfe4j:
  base-dir-path: ${BASE_DIR_PATH:/}
  restrict-to-base-dir: ${RESTRICT_TO_BASE_DIR:false}
  title: ${TITLE:SFE4J}
  description: ${DESCRIPTION:Simple File Explorer for spring-boot based Java Web Application.}
  quick-links:
    root: /
    logs: /data/logs
  # Protected directories must exist at startup, otherwise the application refuses to start.
  # folder-passwords:
  #   "[/data/secret]": "my_password"
  access:
    symbolic-link-policy: ${SYMBOLIC_LINK_POLICY:deny}
    grant-ttl-seconds: ${GRANT_TTL_SECONDS:1800}
    password-attempts-per-minute: ${PASSWORD_ATTEMPTS_PER_MINUTE:5}
  preview:
    max-bytes: ${PREVIEW_MAX_BYTES:1048576}
  download:
    max-concurrent: ${DOWNLOAD_MAX_CONCURRENT:8}
  logs:
    enabled: ${LOGS_ENABLED:true}
    default-lines: ${LOGS_DEFAULT_LINES:200}
    max-lines: ${LOGS_MAX_LINES:2000}
    max-scan-bytes: ${LOGS_MAX_SCAN_BYTES:1048576}
    poll-interval-ms: ${LOGS_POLL_INTERVAL_MS:1000}
    max-connections: ${LOGS_MAX_CONNECTIONS:20}
    max-connections-per-session: ${LOGS_MAX_CONNECTIONS_PER_SESSION:2}
    max-connection-seconds: ${LOGS_MAX_CONNECTION_SECONDS:1800}
    max-queue-bytes: ${LOGS_MAX_QUEUE_BYTES:262144}
    max-chunk-bytes: ${LOGS_MAX_CHUNK_BYTES:65536}