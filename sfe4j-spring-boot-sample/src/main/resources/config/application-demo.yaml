spring:
  application:
    name: "sfe4j-demo"
  boot:
    admin:
      client:
        url: https://spring-boot-admin.amoylabs.com:30443
        instance:
          service-host-type: IP

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

sfe4j:
  # The protected directory must exist at startup; the demo container runs as root, so /root exists.
  folder-passwords:
    "[/root]": ${ROOT_PASSWORD:root}

  # Text reading and log following are enabled for the demo.
  logs:
    enabled: ${LOGS_ENABLED:true}
    max-connections: ${LOGS_MAX_CONNECTIONS:20}
    max-connections-per-session: ${LOGS_MAX_CONNECTIONS_PER_SESSION:2}
