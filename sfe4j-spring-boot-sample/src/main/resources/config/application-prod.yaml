# Production example for the standalone SFE4J deployment used by the container image.
#
# Do not publish the file system root. The base directory below is a dedicated directory owned by the
# deployment; it must exist, be a directory and be resolvable, otherwise the application refuses to
# start. Mount the directory to be published read-only, for example
# `docker run -v /srv/files:/data:ro -p8080:8080 sfe4j/sfe4j`.
sfe4j:
  base-dir-path: ${BASE_DIR_PATH:/data}
  restrict-to-base-dir: ${RESTRICT_TO_BASE_DIR:true}
  title: ${TITLE:Files}
  description: ${DESCRIPTION:Read-only file service.}
  quick-links:
    home: /data
  # Plain text passwords, kept as the simple protection mechanism of this phase. The protected
  # directory must exist at startup, so the entry is commented out until it is really used.
  # folder-passwords:
  #   "[/data/restricted]": "${RESTRICTED_PASSWORD:change-me}"
  access:
    # "within-root" follows symbolic links as long as their target stays inside the base directory.
    symbolic-link-policy: ${SYMBOLIC_LINK_POLICY:deny}
    grant-ttl-seconds: ${GRANT_TTL_SECONDS:1800}
    password-attempts-per-minute: ${PASSWORD_ATTEMPTS_PER_MINUTE:5}
  preview:
    max-bytes: ${PREVIEW_MAX_BYTES:1048576}
  download:
    max-concurrent: ${DOWNLOAD_MAX_CONCURRENT:8}
  # Text reading and log following. Set LOGS_ENABLED=false to hide the API and the follow button.
  logs:
    enabled: ${LOGS_ENABLED:true}
    default-lines: ${LOGS_DEFAULT_LINES:200}
    max-lines: ${LOGS_MAX_LINES:2000}
    max-scan-bytes: ${LOGS_MAX_SCAN_BYTES:1048576}
    poll-interval-ms: ${LOGS_POLL_INTERVAL_MS:1000}
    max-connections: ${LOGS_MAX_CONNECTIONS:20}
    max-connections-per-session: ${LOGS_MAX_CONNECTIONS_PER_SESSION:2}
    max-connection-seconds: ${LOGS_MAX_CONNECTION_SECONDS:1800}
    max-queue-bytes: ${LOGS_MAX_QUEUE_BYTES:262144}
    max-chunk-bytes: ${LOGS_MAX_CHUNK_BYTES:65536}
